services:
  app:
    image: ${IMAGE_URI}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:${PORT:-8080}"
    volumes:
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-back_task}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  seed:
    image: ${SEED_IMAGE_URI}
    profiles:
      - tools
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  app_logs:
  postgres_data:
